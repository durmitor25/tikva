<!DOCTYPE html>
<html lang="bs" style="color-scheme:light only">
<head>
<meta charset="utf-8">
<title>Tikva — priprema za ski sezonu</title>
<meta name="description" content="Kalendar treninga, video vjezbe i korekcija gresaka prije ski sezone.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#E9EFF3"><meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;padding:0;height:100dvh;background:#16232E;overflow:hidden;overscroll-behavior:none}iframe{display:block;border:0;width:100%;height:100%}
#inst{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;background:#FFFFFF;color:#16232E;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);font:500 13px/1.3 Manrope,system-ui,sans-serif}
#inst[hidden],#inst [hidden]{display:none}
#inst img{width:38px;height:38px;border-radius:9px;flex:none}
#inst .t{flex:1;min-width:0;display:flex;flex-direction:column}
#inst .t b{font-weight:700;font-size:15px}
#inst .t span{color:rgba(22,35,46,.62);font-size:12px}
#instBtn{flex:none;border:0;border-radius:10px;background:#3E7FA6;color:#FFFFFF;font:700 13px Manrope,system-ui,sans-serif;padding:10px 14px}
#instX{flex:none;border:0;background:transparent;color:rgba(22,35,46,.45);font-size:22px;line-height:1;padding:4px 6px}</style>
</head>
<body>
<iframe src="app.html" title="Tikva" allow="fullscreen"></iframe>
<div id="inst" hidden>
  <img src="icon-192.png" alt="">
  <div class="t"><b>Tikva</b><span id="instTxt">Instaliraj aplikaciju — radi i bez interneta.</span></div>
  <button id="instBtn" type="button">Instaliraj</button>
  <button id="instX" type="button" aria-label="Zatvori">×</button>
</div>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
// Dugme za instalaciju: Android/Chrome nudi sistemski prozor, na iPhoneu kratko uputstvo.
(function () {
  var box = document.getElementById('inst'), btn = document.getElementById('instBtn'), txt = document.getElementById('instTxt'), deferred = null;
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) return;
  function off() { try { return localStorage.getItem('tikvaInstall.hide') === '1'; } catch (e) { return false; } }
  function hide(remember) { box.hidden = true; if (remember) { try { localStorage.setItem('tikvaInstall.hide', '1'); } catch (e) {} } }
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (!off()) box.hidden = false; });
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function (c) { deferred = null; if (c.outcome === 'accepted') hide(false); });
  });
  addEventListener('appinstalled', function () { hide(true); });
  document.getElementById('instX').addEventListener('click', function () { hide(true); });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !off()) { txt.textContent = 'Dodirni Dijeli (kvadrat sa strelicom), pa „Dodaj na početni ekran”.'; btn.hidden = true; box.hidden = false; }
})();
</script>
</body>
</html>
